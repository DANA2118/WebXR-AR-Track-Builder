<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    <title>AR Racing - Lamborghini Marker</title>

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js">
    </script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js">
    </script>


    <link rel="stylesheet" href="css/marker.css">

</head>


<body>

    <a-scene id="marker-scene" mindar-image="
        imageTargetSrc: markers/targets.mind;
        autoStart: true;
        uiLoading: yes;
        uiScanning: yes;
        uiError: yes;
    " color-space="sRGB" renderer="
        colorManagement: true;
        physicallyCorrectLights: true;
        antialias: true;
    " vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

        <a-assets>

            <a-asset-item id="car-model" src="models/car.glb">
            </a-asset-item>

        </a-assets>


        <a-camera position="0 0 0" look-controls="enabled: false">
        </a-camera>

        <a-light type="ambient" color="#ffffff" intensity="1">
        </a-light>


        <a-light type="directional" color="#ffffff" intensity="1.2" position="1 2 1">
        </a-light>

        <a-entity id="lamborghini-target" mindar-image-target="
            targetIndex: 0;
        ">

            <a-entity id="marker-car" gltf-model="#car-model" position="0 0.15 0" rotation="0 180 0"
                scale="0.006 0.006 0.006">

            </a-entity>

            <a-cylinder id="car-platform" position="0 0.02 0" rotation="0 0 0" radius="0.40" height="0.025"
                color="#111111" opacity="0.75">

            </a-cylinder>

            <a-text value="AR RACING" position="0 0.75 0" rotation="-90 0 0" align="center" anchor="center"
                color="#FFFFFF" width="2">

            </a-text>

            <a-text value="Lamborghini Racing Challenge" position="0 0.55 0" rotation="-90 0 0" align="center"
                anchor="center" color="#4CC3D9" width="1.5">

            </a-text>

            <a-text value="Build your own AR race track" position="0 0.40 0" rotation="-90 0 0" align="center"
                anchor="center" color="#FFFFFF" width="1.2">

            </a-text>


        </a-entity>


    </a-scene>

    <div id="marker-ui">


        <a id="home-btn" href="index.html">

            ← Home

        </a>


        <div id="marker-message">

            Point your camera at the Lamborghini marker

        </div>


        <div id="tracking-status" class="tracking-searching">

            Searching for marker...

        </div>


        <a id="start-race-btn" href="markerless.html">

            Build Race Track

        </a>


    </div>



    <script type="module" src="js/marker/markerMain.js">
    </script>


</body>

</html>
