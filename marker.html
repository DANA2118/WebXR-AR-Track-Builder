<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, user-scalable=no">

    <title>AR Racing - Marker Mode</title>

    <script
        src="https://aframe.io/releases/1.8.0/aframe.min.js">
    </script>

    <script
        src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js">
    </script>

    <link
        rel="stylesheet"
        href="css/marker.css">

</head>


<body>


<a-scene

    embedded

    arjs="
        sourceType: webcam;
        debugUIEnabled: false;
    ">


    <a-assets>

        <a-asset-item
            id="car-model"
            src="models/car.glb">
        </a-asset-item>

    </a-assets>


    <a-marker
        preset="hiro"
        id="race-marker">


        <!-- Smaller car -->

        <a-entity

            id="marker-car"

            gltf-model="#car-model"

            scale="0.003 0.003 0.003"

            position="0 0.15 0"

            rotation="0 180 0">

        </a-entity>


        <a-text

            value="AR Racing Challenge"

            position="0 0.8 0"

            rotation="-90 0 0"

            align="center"

            color="#FFFFFF"

            width="2">

        </a-text>


    </a-marker>


    <a-entity camera></a-entity>


</a-scene>


<script
    type="module"
    src="js/marker/markerMain.js">
</script>


</body>

</html>
