<!DOCTYPE html>
<html>

<head>
  <title>AR Track Builder - Markerless</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

  <a-scene xr-mode-ui="XRMode: ar;"
    webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: dom-overlay; overlayElement: #log;"
    ar-hit-test="target:#reticle;">

    <a-assets>
      <a-asset-item id="track-model" src="models/track.glb"></a-asset-item>
    </a-assets>

    <a-entity id="reticle"></a-entity>
    <a-entity id="placed-pieces"></a-entity>

    <a-light type="ambient" color="#FFF" intensity="0.8"></a-light>
    <a-light type="directional" color="#FFF" intensity="0.8" position="1 1 1"></a-light>
  </a-scene>

  <div id="log" style="position:fixed;top:0;left:0;right:0;background:rgba(255,0,0,0.85);
         color:white;font-size:13px;padding:8px;max-height:250px;
         overflow:auto;font-family:monospace;white-space:pre-wrap;pointer-events:none;"></div>

  <script>
    var logEl = document.getElementById('log');
    function log(t) { logEl.innerText += t + '\n'; }

    var scene = document.querySelector('a-scene');
    var reticle = document.querySelector('#reticle');
    var container = document.querySelector('#placed-pieces');

    scene.addEventListener('ar-hit-test-start', function () { log('scanning for surface...'); });
    scene.addEventListener('ar-hit-test-achieved', function () { log('surface found, ready to place'); });
    scene.addEventListener('ar-hit-test-select', function () {
      var pos = reticle.object3D.position;
      log('select fired at: ' + pos.x.toFixed(2) + ', ' + pos.y.toFixed(2) + ', ' + pos.z.toFixed(2));

      var marker = document.createElement('a-box');
      marker.setAttribute('color', 'red');
      marker.setAttribute('scale', '0.3 0.3 0.3');
      marker.setAttribute('position', pos.x + ' ' + pos.y + ' ' + pos.z);
      container.appendChild(marker);

      var piece = document.createElement('a-entity');
      piece.setAttribute('gltf-model', '#track-model');
      piece.setAttribute('scale', '0.2 0.2 0.2');
      piece.setAttribute('position', (pos.x + 0.5) + ' ' + pos.y + ' ' + pos.z);

      piece.addEventListener('model-loaded', function (e) {
        log('track model LOADED');
        var mesh = e.detail.model;
        var box = new THREE.Box3().setFromObject(mesh);
        var center = box.getCenter(new THREE.Vector3());
        var size = box.getSize(new THREE.Vector3());
        log('bbox center: ' + center.x.toFixed(2) + ',' + center.y.toFixed(2) + ',' + center.z.toFixed(2));
        log('bbox size: ' + size.x.toFixed(2) + ',' + size.y.toFixed(2) + ',' + size.z.toFixed(2));
        mesh.position.sub(center); // re-center the mesh on the entity's own origin
      });
      piece.addEventListener('model-error', function (e) { log('track model FAILED: ' + JSON.stringify(e.detail)); });
      container.appendChild(piece);
      log('piece + debug marker appended');
    });
  </script>
</body>

</html>
