<!DOCTYPE html>
<html>
  <head>
    <title>AR Track Builder - Markerless</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body style="margin:0; overflow:hidden;">
    <div id="error-log" style="position:fixed;top:0;left:0;right:0;background:red;
         color:white;font-size:13px;padding:8px;z-index:99999;max-height:220px;
         overflow:auto;font-family:monospace;white-space:pre-wrap;"></div>

    <button id="my-ar-btn" style="position:fixed;bottom:20px;left:20px;z-index:99999;
            padding:14px 22px;font-size:16px;">Enter AR (debug)</button>

    <a-scene xr-mode-ui="XRMode: ar; enabled: false;"
              webxr="optionalFeatures: hit-test, local-floor;"
              ar-hit-test="target:#test-object;">
      <a-box id="test-object" color="#4CC3D9" scale="0.1 0.1 0.1" visible="false"></a-box>
    </a-scene>

    <script>
      var log = document.getElementById('error-log');
      function append(text) { log.innerText += text + '\n'; }

      window.onerror = function (msg, url, line) {
        append('window.onerror: ' + msg + ' (line ' + line + ')');
        return false;
      };
      window.addEventListener('unhandledrejection', function (event) {
        append('unhandledrejection: ' + event.reason);
      });

      document.getElementById('my-ar-btn').addEventListener('click', function () {
        append('Requesting AR session...');
        var sceneEl = document.querySelector('a-scene');
        sceneEl.enterAR().then(function () {
          append('enterAR() resolved successfully.');
        }).catch(function (err) {
          append('enterAR() REJECTED: ' + err.name + ' — ' + err.message);
        });
      });
    </script>
  </body>
</html>
