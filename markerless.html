<!DOCTYPE html>
<html>
  <head>
    <title>AR Track Builder - Markerless</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body style="margin:0; overflow:hidden;">
    <a-scene xr-mode-ui="XRMode: ar;"
              webxr="optionalFeatures: hit-test, local-floor;"
              ar-hit-test="target:#test-object;">
      <a-box id="test-object" color="#4CC3D9" scale="0.1 0.1 0.1" visible="false"></a-box>
    </a-scene>
  </body>
</html>
