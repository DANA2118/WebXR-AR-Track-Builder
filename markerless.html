<!DOCTYPE html>
<html>
  <head>
    <title>AR Track Builder - Markerless</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body style="margin:0; overflow:hidden;">
    <a-scene xr-mode-ui="XRMode: ar;"
              webxr="requiredFeatures: hit-test, local-floor;"
              ar-hit-test="target:#reticle;">

      <a-assets>
        <a-asset-item id="track-model" src="models/track.glb"></a-asset-item>
      </a-assets>

      <a-entity id="reticle"></a-entity>
      <a-entity id="placed-pieces"></a-entity>
    </a-scene>

    <script>
      var scene = document.querySelector('a-scene');
      var reticle = document.querySelector('#reticle');
      var container = document.querySelector('#placed-pieces');

      scene.addEventListener('ar-hit-test-select', function () {
        var pos = reticle.object3D.position;

        var piece = document.createElement('a-entity');
        piece.setAttribute('gltf-model', '#track-model');
        piece.setAttribute('position', pos.x + ' ' + pos.y + ' ' + pos.z);
        container.appendChild(piece);
      });
    </script>
  </body>
</html>
