<!DOCTYPE html>
<html>
  <head>
    <title>AR Track Builder - Markerless</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body style="margin:0; overflow:hidden;">
    <div id="error-log" style="position:fixed;top:0;left:0;right:0;background:red;
         color:white;font-size:12px;padding:8px;z-index:99999;max-height:150px;
         overflow:auto;font-family:monospace;"></div>
    <script>
      window.onerror = function(msg, url, line) {
        document.getElementById('error-log').innerText += msg + ' (line ' + line + ')\n';
        return false;
      };
      
    </script>

    <a-scene xr-mode-ui="XRMode: ar;"
              webxr="optionalFeatures: hit-test, local-floor;"
              ar-hit-test="target:#test-object;">
      <a-box id="test-object" color="#4CC3D9" scale="0.1 0.1 0.1" visible="false"></a-box>
    </a-scene>
  </body>
</html>
