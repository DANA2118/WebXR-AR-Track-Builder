<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>AR Race Track Builder</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <link rel="stylesheet" href="css/race.css">
</head>
<body>
  <a-scene
    xr-mode-ui="XRMode: ar"
    webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: dom-overlay; overlayElement: #overlay;"
    ar-hit-test="target:#reticle;">

    <a-assets timeout="10000">
      <a-asset-item id="track-model" src="models/road.glb"></a-asset-item>
      <a-asset-item id="cone-model" src="models/cone.glb"></a-asset-item>
      <a-asset-item id="car-model" src="models/car.glb"></a-asset-item>
    </a-assets>

    <a-entity id="reticle"></a-entity>
    <a-entity id="placed-pieces"></a-entity>
    <a-entity id="race-elements"></a-entity>

    <a-light type="ambient" color="#FFFFFF" intensity="0.8"></a-light>
    <a-light type="directional" color="#FFFFFF" intensity="0.8" position="1 1 1"></a-light>
  </a-scene>

  <div id="overlay">
    <a class="back-link" href="index.html">← Home</a>

    <div id="hint">
      Point at a floor/table · choose a piece · tap to place
    </div>

    <div id="race-hud">
      <div id="race-status">BUILD MODE</div>
      <div id="race-info">
        Time: <span id="timer">0.00</span>s
        <span class="divider">|</span>
        Hits: <span id="hit-count">0</span>
        <span class="divider">|</span>
        Best: <span id="best-time">--</span>
      </div>
    </div>

    <div id="countdown">3</div>

    <div id="result-panel">
      <h2>🏁 Race Finished!</h2>
      <p>Time: <strong><span id="final-time">0.00</span>s</strong></p>
      <p>Cone Hits: <strong><span id="final-hits">0</span></strong></p>
      <p>Penalties: <strong><span id="final-penalty">0</span>s</strong></p>
      <p>Score: <strong><span id="final-score">0</span></strong></p>
      <button id="retry-btn">Race Again</button>
    </div>

    <div id="steering-controls">
      <button id="left-btn" class="steer-btn" aria-label="Steer left">◀</button>
      <button id="right-btn" class="steer-btn" aria-label="Steer right">▶</button>
    </div>

    <div id="speed-container">
      <span id="speed-label">SPEED</span>
      <input type="range" id="speed-slider" min="0.15" max="1" step="0.05" value="0.35">
    </div>

    <div id="picker">
      <button class="piece-btn active" data-type="track-model">Road</button>
      <button class="piece-btn" data-type="cone-model">Cone</button>
      <button class="piece-btn" data-type="car-model">Car</button>
      <button id="race-btn">🏁 Start Race</button>
      <button id="clear-btn">Clear</button>
    </div>
  </div>

  <script type="module" src="js/markerless/main.js"></script>
</body>
</html>
