<!DOCTYPE html>
<html>
  <head>
    <title>WebXR AR Track Builder - Marker AR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <!-- Tap-to-start overlay: needed because mobile browsers block audio
         autoplay unless it starts from a real user tap -->
    <div id="start-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.85);
         color:white;display:flex;align-items:center;justify-content:center;
         z-index:9999;font-family:sans-serif;text-align:center;">
      <div>
        <p>Point your camera at the Hiro marker</p>
        <button id="start-btn" style="padding:12px 24px;font-size:1em;">Start</button>
      </div>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">

      <a-assets>
        <a-asset-item id="car-model" src="models/car.glb"></a-asset-item>
        <audio id="engine-sound" src="sounds/engine-hum.mp3" preload="auto"></audio>
      </a-assets>

      <a-marker preset="hiro">
        <a-entity
          gltf-model="#car-model"
          position="0 0 0"
          scale="0.001 0.001 0.001"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"
          sound="src: #engine-sound; loop: true; volume: 0.4"
        ></a-entity>
        <a-light type="ambient" color="#BBB"></a-light>
        <a-light type="directional" color="#FFF" intensity="0.6" position="1 1 1"></a-light>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      document.getElementById('start-btn').addEventListener('click', function () {
        document.getElementById('start-overlay').style.display = 'none';
        var carEl = document.querySelector('[sound]');
        if (carEl && carEl.components.sound) {
          carEl.components.sound.playSound();
        }
      });
    </script>
  </body>
</html>
